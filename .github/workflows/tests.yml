name: tests
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit:11
          coverage: pcov
      - name: Check PHP syntax
        run: |
          for file in $(git ls-files '*.php'); do php -l "$file"; done
      - name: Editor panel logic tests
        run: node --test tests/ui.test.cjs
      - name: Unit tests (PHPUnit, with coverage)
        run: |
          phpunit --bootstrap tests/bootstrap.php --do-not-cache-result \
            --coverage-text --coverage-filter classes --display-warnings --fail-on-warning tests/unit

  # The release package installed in a real OJS with PKP's test journal
  ojs:
    name: OJS ${{ matrix.ojs }}, PHP ${{ matrix.php }}, ${{ matrix.db }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {ojs: 3.5.0-6, php: '8.2', db: mariadb}
          - {ojs: 3.5.0-6, php: '8.3', db: mariadb, analyse: true}
          - {ojs: 3.5.0-6, php: '8.4', db: mariadb}
          - {ojs: 3.5.0-6, php: '8.3', db: mysql}
          - {ojs: 3.5.0-6, php: '8.2', db: pgsql}
          - {ojs: 3.5.0-6, php: '8.3', db: pgsql}
          - {ojs: 3.5.0-4, php: '8.3', db: mariadb}
          - {ojs: 3.5.0-5, php: '8.3', db: mariadb}
          - {ojs: 3.5.0-3, php: '8.3', db: mariadb, unsupported: true}
    env:
      # PKP publishes no checksum; this one was recorded from the first download
      OJS_SHA256_3_5_0_6: f5b85703b06e45cc82e56ef72b0a8f42a2f75237e5204dbd0146d9730a627c97
      DATASETS_COMMIT: 32b457f4db44691e231abaf3c9aadbd90cd036be
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, intl, mbstring, mysqli, pdo_mysql, pgsql, pdo_pgsql, xml, zip
          tools: ${{ matrix.analyse && 'phpstan, php-cs-fixer' || 'none' }}

      - uses: actions/cache@v4
        id: ojs-cache
        with:
          path: ojs.tar.gz
          key: ojs-${{ matrix.ojs }}
      - name: Download OJS
        if: steps.ojs-cache.outputs.cache-hit != 'true'
        run: curl -sSfL --retry 3 -o ojs.tar.gz "https://pkp.sfu.ca/ojs/download/ojs-${{ matrix.ojs }}.tar.gz"
      - name: Unpack OJS
        run: |
          sha256sum ojs.tar.gz
          if [ "${{ matrix.ojs }}" = "3.5.0-6" ]; then
            echo "${OJS_SHA256_3_5_0_6}  ojs.tar.gz" | sha256sum --check
          fi
          mkdir "$RUNNER_TEMP/ojs"
          tar -xzf ojs.tar.gz -C "$RUNNER_TEMP/ojs" --strip-components=1
          echo "OJS_DIR=$RUNNER_TEMP/ojs" >> "$GITHUB_ENV"

      # The test journal was made with the newest 3.5 code; older releases get it too
      - name: Load PKP test journal
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/pkp/datasets "$RUNNER_TEMP/datasets"
          cd "$RUNNER_TEMP/datasets"
          git sparse-checkout set "ojs/stable-3_5_0/${{ matrix.db }}"
          git checkout --quiet "$DATASETS_COMMIT"
          cd "ojs/stable-3_5_0/${{ matrix.db }}"
          user=ojs-ci
          case "${{ matrix.db }}" in
            mariadb|mysql)
              if [ "${{ matrix.db }}" = mariadb ]; then image=mariadb:10.11; client=mariadb; else image=mysql:8.0; client=mysql; fi
              docker run -d --name db -p 3306:3306 \
                -e MYSQL_ROOT_PASSWORD=$user -e MYSQL_DATABASE=$user -e MYSQL_USER=$user -e MYSQL_PASSWORD=$user $image
              ready="docker exec db $client -h127.0.0.1 -u$user -p$user $user -e 'select 1'"
              load="docker exec -i db $client -u$user -p$user $user"
              ;;
            pgsql)
              docker run -d --name db -p 5432:5432 \
                -e POSTGRES_USER=$user -e POSTGRES_PASSWORD=$user -e POSTGRES_DB=$user postgres:16
              ready="docker exec db pg_isready -h 127.0.0.1 -U $user -d $user"
              load="docker exec -i db psql -q -v ON_ERROR_STOP=1 -U $user -d $user"
              ;;
          esac
          for attempt in $(seq 1 60); do eval "$ready" >/dev/null 2>&1 && break; sleep 2; done
          eval "$ready"
          $load < database.sql > /dev/null
          cp config.inc.php "$OJS_DIR/"
          cp -r files public "$OJS_DIR/"
          sed -i 's#^base_url = .*#base_url = "http://localhost:8000"#' "$OJS_DIR/config.inc.php"

      - name: Build the release package
        run: |
          git archive --format=tar.gz --prefix=referenceCheck/ -o "$RUNNER_TEMP/referenceCheck.tar.gz" HEAD
          tar -tzf "$RUNNER_TEMP/referenceCheck.tar.gz"
          echo "PACKAGE=$RUNNER_TEMP/referenceCheck.tar.gz" >> "$GITHUB_ENV"

      - name: Start OJS
        run: |
          cd "$OJS_DIR"
          PHP_CLI_SERVER_WORKERS=4 nohup php -d display_errors=0 -d log_errors=1 -S localhost:8000 \
            > "$RUNNER_TEMP/ojs-server.log" 2>&1 &
          curl --silent --fail --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null \
            http://localhost:8000/index.php/publicknowledge/en/login

      - name: Prepare the browsers
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Install the package through the OJS installer
        working-directory: tests/e2e
        run: npx playwright test install.spec.js --output=test-results/install

      - name: Check the package against the OJS code
        if: ${{ !matrix.unsupported }}
        run: php tests/ojs-compat.php "$OJS_DIR"

      - name: Browser tests
        if: ${{ !matrix.unsupported }}
        working-directory: tests/e2e
        run: npx playwright test main.spec.js --output=test-results/main

      - name: Browser test with the outside services cut off
        if: ${{ !matrix.unsupported }}
        working-directory: tests/e2e
        run: |
          cp "$OJS_DIR/config.inc.php" "$RUNNER_TEMP/config.online"
          sed -i '/^\[proxy\]/a http_proxy = "http://127.0.0.1:9"\nhttps_proxy = "http://127.0.0.1:9"' "$OJS_DIR/config.inc.php"
          grep -A3 '^\[proxy\]' "$OJS_DIR/config.inc.php"
          npx playwright test outage.spec.js --output=test-results/outage
          cp "$RUNNER_TEMP/config.online" "$OJS_DIR/config.inc.php"

      - name: Disable the plugin
        if: ${{ !matrix.unsupported }}
        working-directory: tests/e2e
        run: npx playwright test disable.spec.js --output=test-results/disable

      - name: Unsupported release is left alone
        if: ${{ matrix.unsupported }}
        working-directory: tests/e2e
        run: npx playwright test unsupported.spec.js --output=test-results/unsupported

      - name: Static analysis (PHPStan)
        if: ${{ matrix.analyse }}
        run: phpstan analyse --configuration tests/phpstan.neon --no-progress

      - name: PKP coding style
        if: ${{ matrix.analyse }}
        run: php-cs-fixer fix --config tests/php-cs-fixer.php --dry-run --diff --allow-risky=yes

      - name: No plugin errors in the server log
        if: always()
        run: |
          log="$RUNNER_TEMP/ojs-server.log"
          test -f "$log" || exit 0
          grep -iE "PHP (fatal|warning|notice|deprecated).*referenceCheck|referenceCheck.*(exception|error:)" "$log" && exit 1
          grep -iE "PHP Fatal" "$log" && exit 1
          echo "none"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ojs-${{ matrix.ojs }}-php${{ matrix.php }}-${{ matrix.db }}
          path: |
            tests/e2e/screenshots
            tests/e2e/test-results
            ${{ runner.temp }}/ojs-server.log
          retention-days: 7
